name: Build & publish to docker hub

on:
  push:
    branches:
      - main
      - dl
#  schedule:
#    - cron: '30 5 * * *'

permissions:
  contents: read
  actions: read
  checks: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file
          cache: maven

      - name: Run the Maven verify phase
        run: mvn --batch-mode -Dsnyk.skip verify

      - run: mkdir staging && cp target/*.jar staging
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging

      - name: Set short git commit SHA
        id: vars
        run: |
          COMMIT_SHORT_SHA=$(git rev-parse --short ${{ github.sha }})
          # docker tags cannot contain '/', so sanitize the branch name
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            # main: mercator:latest and mercator:<sha>
            echo "DEFAULT_TAG=latest" >> $GITHUB_ENV
            echo "TAGS=$COMMIT_SHORT_SHA" >> $GITHUB_ENV
          else
            # other branches (e.g. dl): mercator:<branch> and mercator:<branch>-<sha>
            echo "DEFAULT_TAG=$BRANCH_TAG" >> $GITHUB_ENV
            echo "TAGS=$BRANCH_TAG-$COMMIT_SHORT_SHA" >> $GITHUB_ENV
          fi


      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1

        with:
          registry: ${{ secrets.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Publish container image to Docker Hub
        id: publish_dockerhub
        env:
          REGISTRY: ${{ secrets.DOCKERHUB_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PAT }}
        run: mvn --batch-mode clean compile jib:build -D jib.to.tags=${{ env.TAGS }}
